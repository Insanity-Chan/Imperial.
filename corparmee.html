    .holo-corp-category {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--holo-cyan);
      text-shadow: 0 0 15px var(--holo-glow);
      margin: 40px 0 20px;
      padding: 15px 20px;
      border: 1px solid var(--holo-cyan);
      background: rgba(26, 0, 0, 0.3);
      box-shadow: 0 0 20px rgba(255,26,26,0.1);
      text-align: center;
    }

    .holo-corp-toggle-all {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .holo-corp-toggle-all button {
      background: transparent;
      border: 1px solid var(--holo-dim);
      color: var(--holo-cyan);
      padding: 6px 20px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s;
    }

    .holo-corp-toggle-all button:hover {
      border-color: var(--holo-cyan);
      background: var(--holo-dim);
      box-shadow: 0 0 10px var(--holo-glow);
    }

    .holo-corp-item {
      margin-bottom: 15px;
      border: 1px solid var(--holo-dim);
      background: rgba(26, 0, 0, 0.2);
      overflow: hidden;
      transition: all 0.3s;
    }

    .holo-corp-item.open {
      border-color: var(--holo-cyan);
      box-shadow: 0 0 15px var(--holo-glow);
    }

    .holo-corp-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      cursor: pointer;
      transition: all 0.3s;
      user-select: none;
    }

    .holo-corp-header:hover {
      background: var(--holo-dim);
    }

    .holo-corp-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--holo-cyan);
      text-shadow: 0 0 8px var(--holo-glow);
    }

    .holo-corp-arrow {
      font-size: 1.2rem;
      color: var(--holo-cyan);
      opacity: 0.6;
      transition: transform 0.3s;
    }

    .holo-corp-item.open .holo-corp-arrow {
      transform: rotate(90deg);
    }

    .holo-corp-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .holo-corp-item.open .holo-corp-content {
      max-height: 2000px;
    }

    .holo-corp-inner {
      padding: 0 20px 25px;
    }
